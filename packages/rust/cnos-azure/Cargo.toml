[package]
name = "cnos-azure"
version = "1.12.0"
edition = "2021"
description = "CNOS Azure Key Vault provider for Rust"
license = "MIT"
repository = "https://github.com/kitsyai/cnos"

[dependencies]
cnos = { path = "../cnos" }
azure_security_keyvault_secrets = "1.0"
azure_identity = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde_json = "1"

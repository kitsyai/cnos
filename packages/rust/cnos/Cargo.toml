[package]
name = "cnos"
version = "1.12.1"
edition = "2021"
rust-version = "1.70"
description = "CNOS Rust client runtime — consumes a server projection and provides typed read APIs"
license = "MIT"
repository = "https://github.com/kitsyai/cnos"
keywords = ["cnos", "configuration", "secrets", "kitsy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
regex = "1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"

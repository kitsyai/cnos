[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnos-firebase"
version = "1.11.4"
description = "CNOS Firebase Secrets provider (thin wrapper over cnos-gcp)"
requires-python = ">=3.8"
dependencies = [
    "cnos>=1.11.4",
    "cnos-gcp>=1.11.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cnos_firebase"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnos-azure"
version = "1.12.2"
description = "CNOS Azure Key Vault provider"
requires-python = ">=3.8"
dependencies = [
    "cnos>=1.12.0",
    "azure-keyvault-secrets>=4.7.0",
    "azure-identity>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cnos_azure"]

[tool.pytest.ini_options]
testpaths = ["tests"]

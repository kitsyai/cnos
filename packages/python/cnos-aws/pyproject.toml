[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnos-aws"
version = "1.13.0"
description = "CNOS AWS Secrets Manager vault provider"
requires-python = ">=3.8"
dependencies = [
    "cnos>=1.12.0",
    "boto3>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cnos_aws"]

[tool.pytest.ini_options]
testpaths = ["tests"]

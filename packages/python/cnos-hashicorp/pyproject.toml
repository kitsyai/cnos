[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnos-hashicorp"
version = "1.12.1"
description = "CNOS HashiCorp Vault vault provider"
requires-python = ">=3.8"
dependencies = [
    "cnos>=1.12.0",
    "hvac>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cnos_hashicorp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

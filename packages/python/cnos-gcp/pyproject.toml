[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnos-gcp"
version = "1.12.3"
description = "CNOS GCP Secret Manager vault provider"
requires-python = ">=3.8"
dependencies = [
    "cnos>=1.12.0",
    "google-cloud-secret-manager>=2.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cnos_gcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

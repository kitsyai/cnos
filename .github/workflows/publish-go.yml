name: Publish — Go (pkg.go.dev tags)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: publish-go-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: ver
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Push Go module tags
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          TAGS=(
            "packages/go/v${VERSION}"
            "packages/go/vault/aws/v${VERSION}"
            "packages/go/vault/azure/v${VERSION}"
            "packages/go/vault/firebase/v${VERSION}"
            "packages/go/vault/gcp/v${VERSION}"
            "packages/go/vault/hashicorp/v${VERSION}"
          )

          for TAG in "${TAGS[@]}"; do
            git tag -a "$TAG" -m "version: ${VERSION}" 2>/dev/null || echo "Tag $TAG already exists"
          done

          git push origin "${TAGS[@]}" || true

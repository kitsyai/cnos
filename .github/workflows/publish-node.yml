name: Publish — Node.js (npm)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'release/node/v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Existing Node package version to publish (X.Y.Z)
        required: true
        type: string

concurrency:
  group: publish-node-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Verify tagged release version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME##*/}"
          EXPECTED_VERSION="${TAG#v}"
          ACTUAL_VERSION="$(node -p "require('./packages/cnos/package.json').version")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION" || {
            echo "Tag requests ${EXPECTED_VERSION}, but Node packages are ${ACTUAL_VERSION}."
            exit 1
          }

      - name: Verify manual release version
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          echo "$EXPECTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Version must be X.Y.Z."
            exit 1
          }
          ACTUAL_VERSION="$(node -p "require('./packages/cnos/package.json').version")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION" || {
            echo "Manual publish requests ${EXPECTED_VERSION}, but Node packages are ${ACTUAL_VERSION}."
            exit 1
          }

      - name: Build and pack public packages
        run: pnpm publish:check

      # Runtime variable packages publish before their dependents.
      # @kitsy/cnos-core is private and bundled into each package.
      - name: Publish @kitsy/cnos-var-server
        run: pnpm --filter @kitsy/cnos-var-server publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-var-http
        run: pnpm --filter @kitsy/cnos-var-http publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-var-rpc
        run: pnpm --filter @kitsy/cnos-var-rpc publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Core packages — must publish before dependents
      - name: Publish @kitsy/cnos
        run: pnpm --filter @kitsy/cnos publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-cli
        run: pnpm --filter @kitsy/cnos-cli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-ui
        run: pnpm --filter @kitsy/cnos-ui publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Framework integrations
      - name: Publish @kitsy/cnos-vite
        run: pnpm --filter @kitsy/cnos-vite publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-next
        run: pnpm --filter @kitsy/cnos-next publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-webpack
        run: pnpm --filter @kitsy/cnos-webpack publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-docs
        run: pnpm --filter @kitsy/cnos-docs publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Vault plugins
      - name: Publish @kitsy/cnos-vault-gcp
        run: pnpm --filter @kitsy/cnos-vault-gcp publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-vault-firebase
        run: pnpm --filter @kitsy/cnos-vault-firebase publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-vault-aws
        run: pnpm --filter @kitsy/cnos-vault-aws publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-vault-hashicorp
        run: pnpm --filter @kitsy/cnos-vault-hashicorp publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kitsy/cnos-vault-azure
        run: pnpm --filter @kitsy/cnos-vault-azure publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
